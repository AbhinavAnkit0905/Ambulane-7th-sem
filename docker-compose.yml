version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ambulane-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_ambulance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_ambulance"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ambulane-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/smart_ambulance?schema=public
      JWT_SECRET: super_secret_smart_ambulance_jwt_key_2026_dev!
      FRONTEND_URL: http://localhost:3000
      SOCKET_URL: http://localhost:5000
      OSRM_BASE_URL: https://router.project-osrm.org
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      TRAFFIC_PROVIDER: simulation
      NEWS_PROVIDER: builtin_rss
      WEATHER_PROVIDER: open_meteo
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ambulane-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
